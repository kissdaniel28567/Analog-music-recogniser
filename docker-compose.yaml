services:
  
  backend:
    build:
      context: ./backend
    container_name: smart_turntable_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app

      # Host PulseAudio-compatible socket provided by pipewire-pulse
      - /run/user/1000/pulse/native:/tmp/xdg-runtime/pulse/native

      # Host native PipeWire socket
      - /run/user/1000/pipewire-0:/tmp/xdg-runtime/pipewire-0

      # Optional: Pulse cookie mounting
      - /home/user/.config/pulse/cookie:/tmp/pulse-cookie:ro

    environment:
      PYTHONUNBUFFERED: "1"

      # Let PulseAudio clients inside the container talk to host pipewire-pulse
      PULSE_SERVER: unix:/tmp/xdg-runtime/pulse/native
      PULSE_COOKIE: /tmp/pulse

      # Let PipeWire-native clients inside the container talk to host PipeWire
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
      PIPEWIRE_RUNTIME_DIR: /tmp/xdg-runtime
      PIPEWIRE_REMOTE: pipewire-0

    user: "1000:1000"

    # Only keep this if your app really needs raw ALSA access
    # devices:
    #   - "/dev/snd:/dev/snd"
    
    # group_add:
    #   - audio

  frontend:
    build:
      context: ./frontend
    container_name: smart_turntable_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend